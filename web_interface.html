<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extreme's NL-QUBO Translation & Execution System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

        :root {
            --bg: #f7f7f8;
            --surface: #ffffff;
            --line: #e5e7eb;
            --ink: #111827;
            --muted: #6b7280;
            --brand: #1f2937;
            --ok: #0f9f66;
            --warn: #b2432a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100dvh;
            background: var(--bg);
            color: var(--ink);
            font-family: "Manrope", "Segoe UI", sans-serif;
        }

        .chat-shell {
            width: 100%;
            height: 100dvh;
            background: var(--bg);
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        .chat-header {
            max-width: 920px;
            width: 100%;
            margin: 0 auto;
            padding: 14px 18px;
            border-bottom: 1px solid var(--line);
            background: var(--bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .brand-block {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-logo {
            width: 72px;
            height: 72px;
            border-radius: 8px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .title-wrap h1 {
            font-size: clamp(1.24rem, 2vw, 1.76rem);
            line-height: 1.15;
            letter-spacing: -0.03em;
            font-weight: 800;
            text-wrap: balance;
        }

        .title-wrap p {
            color: var(--muted);
            font-size: 0.86rem;
            margin-top: 4px;
            font-weight: 500;
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .meta-pill {
            border: 1px solid #d9dce1;
            background: var(--surface);
            color: #374151;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 7px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .mode-pill {
            border: 1px solid #d9dce1;
            background: var(--surface);
            color: #111827;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 7px 10px;
            border-radius: 999px;
            white-space: nowrap;
            display: none;
        }

        .chat-log {
            max-width: 920px;
            width: 100%;
            margin: 0 auto;
            padding: 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .chat-log::-webkit-scrollbar {
            width: 9px;
        }

        .chat-log::-webkit-scrollbar-thumb {
            background: #d3d7dd;
            border-radius: 12px;
        }

        .message {
            max-width: min(92%, 760px);
            border-radius: 14px;
            border: 1px solid var(--line);
            padding: 12px 14px;
            line-height: 1.56;
            font-size: 0.98rem;
            opacity: 0;
            transform: translateY(8px);
            animation: riseIn 260ms ease forwards;
        }

        .message.user {
            align-self: flex-end;
            background: var(--brand);
            color: #f9fafb;
            border-color: #374151;
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--surface);
        }

        .message.system {
            align-self: center;
            font-size: 0.89rem;
            color: var(--muted);
            border-style: dashed;
            background: var(--surface);
            padding: 10px 14px;
        }

        .label {
            display: inline-block;
            font-size: 0.73rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #475569;
            margin-bottom: 7px;
            font-weight: 700;
        }

        .mono {
            font-family: "JetBrains Mono", Consolas, monospace;
            font-size: 0.89rem;
            white-space: pre-wrap;
            color: #1f2937;
        }

        .result-metric {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .result-note {
            margin-top: 8px;
            line-height: 1.5;
        }

        .success-tag {
            display: inline-block;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.85rem;
            font-weight: 800;
            color: #053d25;
            background: #80f0bf;
            border: 1px solid #39c68a;
        }

        .typing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #9ca3af;
            animation: dotPulse 1s infinite ease-in-out;
        }

        .typing span:nth-child(2) { animation-delay: 0.18s; }
        .typing span:nth-child(3) { animation-delay: 0.36s; }

        .action-row {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button.action {
            border: 1px solid #cfd5dd;
            border-radius: 10px;
            padding: 9px 14px;
            background: #ffffff;
            color: #111827;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 120ms ease, opacity 120ms ease, background-color 120ms ease;
        }

        button.action:hover {
            transform: translateY(-1px);
            background-color: #f9fafb;
        }

        button.action:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        .composer {
            max-width: 920px;
            width: 100%;
            margin: 0 auto;
            border-top: 1px solid var(--line);
            background: var(--bg);
            padding: 14px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: end;
        }

        .composer textarea {
            width: 100%;
            min-height: 142px;
            max-height: none;
            resize: none;
            overflow-y: hidden;
            border: 1px solid #d6dae0;
            border-radius: 20px;
            padding: 13px;
            font: inherit;
            line-height: 1.44;
            color: #1f2937;
            background: #ffffff;
        }

        .composer textarea:focus {
            outline: none;
            border-color: #9ca3af;
            box-shadow: 0 0 0 3px rgba(156, 163, 175, 0.18);
        }

        .send-btn {
            min-width: 128px;
            border: none;
            border-radius: 12px;
            padding: 12px 16px;
            background: #111827;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 120ms ease, filter 120ms ease, opacity 120ms ease;
        }

        .send-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }

        .send-btn:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            transform: none;
        }

        .composer-help {
            grid-column: 1 / -1;
            font-size: 0.82rem;
            color: var(--muted);
            font-weight: 600;
            margin-top: -2px;
        }

        .error {
            color: var(--warn);
            font-weight: 700;
        }

        @keyframes riseIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.45; }
            40% { transform: scale(1.1); opacity: 1; }
        }

        @media (max-width: 900px) {
            .chat-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-meta {
                justify-content: flex-start;
            }
        }

        @media (max-width: 760px) {
            .chat-shell {
                height: 100dvh;
            }

            .chat-header {
                padding: 14px;
            }

            .brand-logo {
                width: 54px;
                height: 54px;
            }

            .chat-log {
                padding: 13px;
            }

            .message {
                max-width: 96%;
            }

            .composer {
                padding: 10px;
                grid-template-columns: 1fr;
            }

            .send-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="chat-shell">
        <header class="chat-header">
            <div class="brand-block">
                <img class="brand-logo" src="/static/logowithtransparent.png" alt="Q logo">
                <div class="title-wrap">
                    <h1>Extreme's NL-QUBO Translation & Execution System</h1>
                    <p>Natural-language optimization to validated QUBO and solver output</p>
                </div>
            </div>
            <div class="header-meta">
                <div class="meta-pill">Pipeline: Translate -> Validate -> Solve</div>
                <div class="mode-pill" id="modePill" style="display:none;">DEMO FLOW</div>
            </div>
        </header>

        <section id="chatLog" class="chat-log"></section>

        <footer class="composer">
            <textarea id="promptInput" placeholder="Describe your optimization problem...">Schedule 8 truck drivers to complete 11 local deliveries in one workday.
Each delivery must be assigned to exactly one driver.
No driver may be assigned more than 2 deliveries.
Drivers can only use routes that avoid left turns, so each assigned delivery must use a right-turn-only route.
At least 2 drivers must be reserved for priority shipments in the afternoon.
Minimize the total estimated travel time while keeping workloads balanced across drivers.</textarea>
            <button id="sendBtn" class="send-btn" type="button">Translate Prompt</button>
            <p class="composer-help">Shortcut: press Ctrl+Enter or Shift+Enter to translate</p>
        </footer>
    </main>

    <script>
        let currentPromptId = "";
        let currentPromptText = "";
        let latestResult = null;
        let isBusy = false;
        let lastBackendWarning = "";

        const chatLog = document.getElementById("chatLog");
        const promptInput = document.getElementById("promptInput");
        const sendBtn = document.getElementById("sendBtn");
        const modePill = document.getElementById("modePill");

        function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        function scrollToBottom() {
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function withBreaks(value) {
            return escapeHtml(value).replace(/\n/g, "<br>");
        }

        async function parseResponseData(response) {
            const text = await response.text();
            if (!text) {
                return {};
            }
            try {
                return JSON.parse(text);
            } catch (_err) {
                return { message: text };
            }
        }

        function addMessage(role, html) {
            const node = document.createElement("article");
            node.className = `message ${role}`;
            node.innerHTML = html;
            chatLog.appendChild(node);
            scrollToBottom();
            return node;
        }

        function addTyping(labelText) {
            return addMessage("assistant", `
                <div class="label">${labelText}</div>
                <div class="typing"><span></span><span></span><span></span></div>
            `);
        }

        function setBusy(flag) {
            isBusy = flag;
            sendBtn.disabled = flag;
            promptInput.disabled = flag;
            sendBtn.textContent = flag ? "Processing..." : "Translate Prompt";
        }

        async function syncModeBadge() {
            if (!modePill) {
                return;
            }
            try {
                const response = await fetch("/health");
                const data = await parseResponseData(response);
                const isDemo = Boolean(data.demo_mode);
                modePill.style.display = isDemo ? "inline-block" : "none";
                modePill.textContent = isDemo ? "DEMO FLOW" : "";
            } catch (_err) {
                modePill.style.display = "none";
                modePill.textContent = "";
            }
        }

        function autoGrowTextarea() {
            promptInput.style.height = "auto";
            promptInput.style.height = `${promptInput.scrollHeight}px`;
        }

        function renderTranslationSummary(data) {
            const summary = data.qubo_summary || {};
            const fidelity = data.fidelity || {};
            const fidelityPercent = Math.max(0, Math.min(100, Number(fidelity.score ?? 0) * 100));
            const backendMode = data.backend_mode || "demo-mock";
            const constraints = Array.isArray(summary.constraints)
                ? summary.constraints.map((c) => {
                    if (typeof c === "string") {
                        return c;
                    }
                    if (c && typeof c === "object" && c.expression) {
                        return c.expression;
                    }
                    return JSON.stringify(c);
                }).join(", ")
                : "N/A";

            addMessage("assistant", `
                <div class="label">Translator</div>
                <div class="mono">Translating prompt...
LLM translation completed.

Validating JSON...
JSON is valid

Compiling JSON into QUBO...
QUBO compilation successful

--- QUBO Summary ---
Variables: ${summary.variables ?? "N/A"}
Objective: ${escapeHtml(summary.objective ?? "N/A")}
Constraints: ${escapeHtml(constraints)}
Model Size: ${summary.term_count ?? "N/A"} binary variables
Backend: ${backendMode}
                ----------------------------------------------------------</div>
                <div class="result-metric">
                    Fidelity Score: <span class="success-tag">${fidelityPercent.toFixed(1)}%</span>
                </div>
                <div class="result-note"><strong>Reverse Translation:</strong><br>"${withBreaks(fidelity.reverse_translation || "N/A")}"</div>
            `);

            if (data.warning) {
                lastBackendWarning = String(data.warning);
                addMessage("assistant", `<span class="error">${escapeHtml(data.warning)}</span>`);
            }
        }

        function renderExecutionResult(data) {
            const result = data.result || {};
            const solution = Array.isArray(result.solution) ? result.solution : [];
            const backendMode = data.backend_mode || "demo-mock";

            const rows = solution.map((row) => {
                if (row.driver && Array.isArray(row.deliveries)) {
                    return `Driver ${row.driver} - Deliveries ${row.deliveries.join(", ")}`;
                }
                if (row.driver && row.reserved_for) {
                    return `Driver ${row.driver} - Reserved for ${row.reserved_for}`;
                }
                if (row.variable !== undefined && row.value !== undefined) {
                    return `${row.variable} = ${row.value}`;
                }
                if (row.note) {
                    return row.note;
                }
                if (typeof row === "string") {
                    return row;
                }
                return JSON.stringify(row);
            }).join("\n");

            addMessage("assistant", `
                <div class="label">Solver</div>
                <div class="mono">Running QUBO on local solver...
Execution complete

--- Solver Results ---
Best Objective Value: ${result.best_objective ?? "N/A"}
Feasible: ${result.feasible === true ? "Yes" : "No"}
Runtime: ${result.runtime_s ?? "N/A"} seconds
Constraint Violations: ${result.constraint_violations ?? "N/A"}
Backend: ${backendMode}
Solution Preview:
${escapeHtml(rows)}</div>
            `);

            if (data.warning && String(data.warning) !== lastBackendWarning) {
                lastBackendWarning = String(data.warning);
                addMessage("assistant", `<span class="error">${escapeHtml(data.warning)}</span>`);
            }

            const saveMsg = addMessage("assistant", `
                <div>Would you like to save logs and metrics?</div>
                <div class="action-row">
                    <button class="action" id="saveBtn" type="button">Save</button>
                </div>
            `);

            const saveBtn = saveMsg.querySelector("#saveBtn");
            saveBtn.addEventListener("click", saveResultPayload);
        }

        function addProceedButton() {
            const msg = addMessage("assistant", `
                <div>Would you like to proceed to execution?</div>
                <div class="action-row">
                    <button class="action" id="proceedBtn" type="button">Proceed</button>
                </div>
            `);

            const proceedBtn = msg.querySelector("#proceedBtn");
            proceedBtn.addEventListener("click", proceedToExecution);
        }

        async function startTranslation() {
            if (isBusy) {
                return;
            }

            const prompt = promptInput.value.trim();
            if (!prompt) {
                addMessage("assistant", '<span class="error">Please enter a prompt first.</span>');
                return;
            }

            currentPromptText = prompt;
            currentPromptId = "";
            latestResult = null;
            lastBackendWarning = "";

            addMessage("user", `<div>${withBreaks(prompt)}</div>`);
            setBusy(true);

            const typing = addTyping("Translator");
            try {
                const call = fetch("/api/translate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt_text: prompt })
                });

                const [response] = await Promise.all([call, sleep(1400)]);
                const data = await parseResponseData(response);
                typing.remove();

                if (!response.ok) {
                    const detail = data.details ? ` (${data.details})` : "";
                    throw new Error((data.message || "Translation failed.") + detail);
                }

                currentPromptId = data.prompt_id || "";
                renderTranslationSummary(data);
                addProceedButton();
            } catch (error) {
                typing.remove();
                addMessage("assistant", `<span class="error">Translation failed: ${escapeHtml(error.message)}</span>`);
            } finally {
                setBusy(false);
            }
        }

        async function proceedToExecution() {
            if (isBusy) {
                return;
            }

            if (!currentPromptId) {
                addMessage("assistant", '<span class="error">No translated prompt found. Please translate first.</span>');
                return;
            }

            setBusy(true);
            const typing = addTyping("Solver");

            try {
                const call = fetch("/api/execute", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt_id: currentPromptId, solver: "local" })
                });

                const [response] = await Promise.all([call, sleep(2300)]);
                const data = await parseResponseData(response);
                typing.remove();

                if (!response.ok) {
                    const detail = data.details ? ` (${data.details})` : "";
                    throw new Error((data.message || "Execution failed.") + detail);
                }

                latestResult = data.result || null;
                renderExecutionResult(data);
            } catch (error) {
                typing.remove();
                addMessage("assistant", `<span class="error">Execution failed: ${escapeHtml(error.message)}</span>`);
            } finally {
                setBusy(false);
            }
        }

        function saveResultPayload() {
            if (!latestResult) {
                addMessage("assistant", '<span class="error">No execution result to save yet.</span>');
                return;
            }

            const payload = {
                prompt_id: currentPromptId,
                prompt: currentPromptText,
                result: latestResult
            };

            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");
            anchor.href = url;
            anchor.download = `demo_result_${currentPromptId || "unknown"}.json`;
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            URL.revokeObjectURL(url);

            addMessage("system", "Result payload downloaded.");
        }

        sendBtn.addEventListener("click", startTranslation);
        promptInput.addEventListener("input", autoGrowTextarea);
        promptInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && (event.ctrlKey || event.shiftKey)) {
                startTranslation();
            }
        });

        autoGrowTextarea();
        syncModeBadge();

        addMessage("assistant", `
            <div class="label">System</div>
            Paste or edit the sample prompt, then click <strong>Translate Prompt</strong>.<br>
            The demo intentionally pauses during translation and solving to simulate live processing.
        `);
    </script>
</body>
</html>
