name: Build PDF and Zip with Version

on:
  push:
    branches: [ main ]   # Change if your default branch is "master"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # If you already have requirements.txt, add:
          # pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Read version
        id: get_version
        run: echo "version=$(cat version.txt)" >> $GITHUB_OUTPUT

      - name: Set up LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: dsnManual.tex

      - name: Prepare output folder
        run: |
          mkdir output
          mv main.pdf output/Report_v${{ steps.get_version.outputs.version }}.pdf

      - name: Create ZIP
        run: |
          zip -r QuantumOptimizationLLM_v${{ steps.get_version.outputs.version }}.zip output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantumOptimizationLLM_v${{ steps.get_version.outputs.version }}
          path: QuantumOptimizationLLM_v${{ steps.get_version.outputs.version }}.zip
