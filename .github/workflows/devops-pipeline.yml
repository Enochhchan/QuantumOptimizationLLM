name: Build LaTeX and Package PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-latex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to get commit SHA

      - name: Get commit SHA
        id: commit
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "Commit SHA: $COMMIT_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Auto-increment build number
        id: version
        run: |
          # Increment build number automatically
          NEW_VERSION=$(python version.py)
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Build number auto-incremented to: $NEW_VERSION"
          
          # Commit the updated version.txt back to repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "Auto-increment build number to $NEW_VERSION [skip ci]" || exit 0
          git push || exit 0

      - name: Write version and commit SHA to version.tex
        working-directory: latex
        run: |
          echo "v${{ steps.version.outputs.version }} (Commit: ${{ steps.commit.outputs.sha }})" > version.tex

      - name: Install minimal LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            texlive-bibtex-extra \
            texlive-pictures \
            texlive-extra-utils \
            latexmk

      - name: Compile dsnManual.tex
        working-directory: latex
        run: |
          latexmk -pdf -interaction=nonstopmode dsnManual.tex

      - name: List generated files (debug)
        working-directory: latex
        run: ls -R

      - name: Create ZIP with compiled PDF
        working-directory: latex
        run: |
          mkdir -p build
          cp dsnManual.pdf build/dsnManual_v${{ steps.version.outputs.version }}_${{ steps.commit.outputs.sha }}.pdf
          cd build
          zip dsnManual_v${{ steps.version.outputs.version }}_${{ steps.commit.outputs.sha }}.zip dsnManual_v${{ steps.version.outputs.version }}_${{ steps.commit.outputs.sha }}.pdf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsnManual-pdf-v${{ steps.version.outputs.version }}-${{ steps.commit.outputs.sha }}
          path: latex/build/dsnManual_v${{ steps.version.outputs.version }}_${{ steps.commit.outputs.sha }}.zip
