name: DevOps Pipeline - Test and Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Read version from version.txt
        id: get_version
        run: |
          VERSION=$(tr -d ' \n' < version.txt)
          echo "Version is $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run pytest
        run: |
          pytest

      - name: Create versioned ZIP
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          mkdir -p dist
          cp latex/2025F_SSW423_07_Extreme.pdf "dist/QuantumOptimizationLLM_v${VERSION}.pdf"
          cd dist
          zip "QuantumOptimizationLLM_v${VERSION}.zip" "QuantumOptimizationLLM_v${VERSION}.pdf"

      - name: Upload versioned artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantumOptimizationLLM_v${{ steps.get_version.outputs.version }}
          path: dist/QuantumOptimizationLLM_v${{ steps.get_version.outputs.version }}.zip
