name: Build LaTeX and Package PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-latex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live and latexmk
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            latexmk

      - name: Compile dsnManual.tex
        working-directory: latex
        run: |
          latexmk -pdf -interaction=nonstopmode dsnManual.tex

      - name: List generated files (debug)
        working-directory: latex
        run: ls -R

      - name: Create ZIP with compiled PDF
        working-directory: latex
        run: |
          mkdir -p build
          cp dsnManual.pdf build/
          cd build
          zip dsnManual_artifact.zip dsnManual.pdf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsnManual-pdf-zip
          path: latex/build/dsnManual_artifact.zip
