name: Build LaTeX and Package PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-latex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to get commit SHA

      - name: Get commit SHA
        id: commit
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "Commit SHA: $COMMIT_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Write commit SHA to version.tex
        working-directory: latex
        run: |
          echo "Commit: ${{ steps.commit.outputs.sha }}" > version.tex

      - name: Install minimal LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            texlive-bibtex-extra \
            texlive-pictures \
            texlive-extra-utils \
            latexmk

      - name: Compile dsnManual.tex
        working-directory: latex
        run: |
          latexmk -pdf -interaction=nonstopmode dsnManual.tex

      - name: List generated files (debug)
        working-directory: latex
        run: ls -R

      - name: Create ZIP with compiled PDF
        working-directory: latex
        run: |
          mkdir -p build
          cp dsnManual.pdf build/dsnManual_${{ steps.commit.outputs.sha }}.pdf
          cd build
          zip dsnManual_${{ steps.commit.outputs.sha }}.zip dsnManual_${{ steps.commit.outputs.sha }}.pdf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsnManual-pdf-${{ steps.commit.outputs.sha }}
          path: latex/build/dsnManual_${{ steps.commit.outputs.sha }}.zip
