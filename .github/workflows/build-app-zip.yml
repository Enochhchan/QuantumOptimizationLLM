name: Build EXE ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          py -m pip install --upgrade pip
          py -m pip install -r requirements.txt
          py -m pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          py -m PyInstaller --onefile --add-data "web_interface.html;." app.py

      - name: Zip EXE and files
        run: |
          cd dist
          powershell Compress-Archive -Path * -DestinationPath ..\runnable-app.zip

      - name: Upload EXE zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: runnable-app
          path: runnable-app.zip
