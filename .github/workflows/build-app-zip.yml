name: Build EXE ZIP

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          py -m pip install --upgrade pip
          py -m pip install -r requirements.txt
          py -m pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          py -m PyInstaller --onefile --add-data "web_interface.html;." app.py

      - name: Create launcher and ZIP
        run: |
          cd dist
          # create a batch file so the grader just double-clicks once
          "@echo off" | Out-File -Encoding ascii start_app.bat
          'start "" "app.exe"' | Add-Content start_app.bat
          'timeout /t 2 >nul' | Add-Content start_app.bat
          'start "" "http://127.0.0.1:5000"' | Add-Content start_app.bat

          # zip everything in dist into runnable-app.zip
          Compress-Archive -Path * -DestinationPath ..\runnable-app.zip


      - name: Upload ZIP to this Release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: runnable-app.zip
          asset_name: runnable-app.zip
          asset_content_type: application/zip

