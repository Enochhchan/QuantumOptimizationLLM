name: Build Windows EXE

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          py -m pip install --upgrade pip
          py -m pip install -r requirements.txt
          py -m pip install pyinstaller

      - name: Build standalone EXE with PyInstaller
        run: |
          py -m PyInstaller --noconfirm --clean app.spec

      - name: Prepare release asset
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $assetName = "NL-QUBO-App-${{ github.ref_name }}.exe"
          if ("${{ github.event_name }}" -eq "push") {
            $assetName = "NL-QUBO-App-main-${{ github.sha }}.exe"
          }
          Copy-Item -LiteralPath dist\app.exe -Destination ("release\" + $assetName) -Force
          "ASSET_NAME=$assetName" >> $env:GITHUB_ENV

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/${{ env.ASSET_NAME }}

      - name: Upload EXE to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ env.ASSET_NAME }}
